veredito:
  aceito:
    titulo: NOVO SANGUE
    texto: Novo Sangue... agora você faz parte do Qawsedismo, que os deuses Qã, Sûr e Wér guardem seus passos, vigiem seu sono e nunca desviem o olhar de você. Seu nome foi escrito no Rebanho. A porta que se fechou atrás de você não abre de novo — mas agora você já está do lado de dentro. Bem-vindo(a), irmão(ã).
  negado:
    titulo: A PORTA CONTINUA FECHADA
    texto: Os deuses Qã, Sûr e Wér olharam pra você e não reconheceram nada ali. Não hoje. A escuridão te devolve pra onde você veio, sem rancor — só sem lugar pra você aqui dentro. Talvez numa outra vida.
