codigo_dono: qsw
intro:
  - A luz se apaga assim que voce clica.
  - isso nao e um teste. e uma entrevista. e so acontece uma vez.
  - depois de comecar, nao tem "tentar de novo". o que voce responder, responder.
  - no final a gente entra os dois numa sala. eu, e o que sobrou de voce.
  - so eu decido se voce fica. e posso decidir a qualquer momento.
perguntas:
  - texto: Se voce estivesse andando a noite em uma rua deserta completamente sozinho(a) e faltasse luz nesse momento, como agiria?
    opcoes:
      - Eu meteria o pe dali, slk que medo
      - Ficaria so com medo mesmo
      - Ia pegar meu celular e ligar o flash
      - Nao sei
  - texto: Você acha que ser Puta e um emprego digno?
    opcoes:
      - Sim
      - Não
  - texto: Você acha que deveria ter ginecologista homem?
    opcoes:
      - NUNCA
      - Sim
      - Não
      - Sei lá man, fica me perguntando as coisa
  - texto: voce acha que
    opcoes:
      - que oque?
      - sim
      - não
  - texto: oque voce enterraria?
    opcoes:
      - um corpo
      - dinheiro
      - objeto valioso
desafios:
  - tipo: reacao
    label: O SINAL
    instrucao: quando o quadrado ficar cheio, toque nele. se hesitar, ele ja era.
    duracao: 5
  - tipo: memoria
    label: A SEQUENCIA
    instrucao: decore a ordem dos simbolos. depois repita, na mesma ordem. uma chance so.
    duracao: 5
  - tipo: segurar
    label: O PESO
    instrucao: segure o simbolo sem soltar ate o fim. soltar antes e desistir.
    duracao: 5
