<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<div class="pagina-toda">
  <header>
    <a class="nome-do-blog" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% include menu.html %}
  </header>
  <main>
    {{ content }}
  </main>
  {% include rodape.html %}
</div>
<script src="{{ '/assets/js/hub.js' | relative_url }}" data-base="{{ '/' | relative_url }}" defer></script>
</body>
</html>
